services:
  db:
    image: 'postgres:17.6-alpine'
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-openlivery}'
      POSTGRES_USER: '${POSTGRES_USER:-openlivery}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: '${OPENLIVERY_IMAGE_PREFIX:-ghcr.io/sarrazola/openlivery}-api:${OPENLIVERY_VERSION:-latest}'
    platform: linux/amd64
    environment:
      DATABASE_URL: 'postgresql+psycopg://${POSTGRES_USER:-openlivery}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openlivery}'
      SECRET_KEY: '${SECRET_KEY:?Set SECRET_KEY}'
      ENCRYPTION_KEY: '${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}'
      COMPOSIO_API_KEY: '${COMPOSIO_API_KEY:-}'
      WHATSAPP_BRIDGE_TOKEN: '${WHATSAPP_BRIDGE_TOKEN:?Set WHATSAPP_BRIDGE_TOKEN}'
      WHATSAPP_BRIDGE_URL: 'http://whatsapp:3101'
      FRONTEND_URL: '${OPENLIVERY_PUBLIC_URL:?Set OPENLIVERY_PUBLIC_URL}'
      COOKIE_SECURE: 'true'
      COOKIE_SAMESITE: lax
      ACCESS_TOKEN_MINUTES: '${ACCESS_TOKEN_MINUTES:-10080}'
      STORAGE_DIR: /app/backend/storage
    volumes:
      - 'backend_storage:/app/backend/storage'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - '-c'
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-}'
    image: '${OPENLIVERY_IMAGE_PREFIX:-ghcr.io/sarrazola/openlivery}-web:${OPENLIVERY_VERSION:-latest}'
    platform: linux/amd64
    environment:
      BACKEND_INTERNAL_URL: 'http://api:8000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
  whatsapp:
    build:
      context: ./apps/whatsapp
      dockerfile: Dockerfile
    image: '${OPENLIVERY_IMAGE_PREFIX:-ghcr.io/sarrazola/openlivery}-whatsapp:${OPENLIVERY_VERSION:-latest}'
    platform: linux/amd64
    environment:
      BACKEND_URL: 'http://api:8000'
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: 3101
      WHATSAPP_BRIDGE_TOKEN: '${WHATSAPP_BRIDGE_TOKEN:?Set WHATSAPP_BRIDGE_TOKEN}'
      WHATSAPP_STORE_URL: 'postgres://${POSTGRES_USER:-openlivery}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openlivery}?sslmode=disable&search_path=whatsmeow'
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/bridge
        - '-healthcheck'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
  proxy:
    image: 'caddy:2-alpine'
    environment:
      SERVICE_URL_PROXY_80: /
    configs:
      -
        source: gateway
        target: /etc/caddy/Caddyfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '-O'
        - /dev/null
        - 'http://127.0.0.1/login'
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  n8n_db:
    image: 'postgres:16.11-alpine'
    environment:
      POSTGRES_DB: '${N8N_POSTGRES_DB:-n8n}'
      POSTGRES_USER: '${N8N_POSTGRES_USER:-n8n}'
      POSTGRES_PASSWORD: '${N8N_POSTGRES_PASSWORD:?Set N8N_POSTGRES_PASSWORD}'
    volumes:
      - 'n8n_postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  n8n:
    image: 'n8nio/n8n:${N8N_VERSION:-2.39.8}'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n_db
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: '${N8N_POSTGRES_DB:-n8n}'
      DB_POSTGRESDB_USER: '${N8N_POSTGRES_USER:-n8n}'
      DB_POSTGRESDB_PASSWORD: '${N8N_POSTGRES_PASSWORD:?Set N8N_POSTGRES_PASSWORD}'
      N8N_ENCRYPTION_KEY: '${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY}'
      N8N_HOST: '${N8N_PUBLIC_HOST:?Set N8N_PUBLIC_HOST}'
      N8N_PROTOCOL: https
      N8N_PORT: '5678'
      N8N_PROXY_HOPS: '1'
      N8N_SECURE_COOKIE: 'true'
      N8N_EDITOR_BASE_URL: '${N8N_PUBLIC_URL:?Set N8N_PUBLIC_URL}'
      WEBHOOK_URL: '${N8N_PUBLIC_URL:?Set N8N_PUBLIC_URL}'
      SERVICE_URL_N8N_5678: /
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_RUNNERS_ENABLED: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '${N8N_EXECUTIONS_DATA_MAX_AGE:-336}'
      GENERIC_TIMEZONE: '${GENERIC_TIMEZONE:-America/Santiago}'
      TZ: '${GENERIC_TIMEZONE:-America/Santiago}'
    volumes:
      - 'n8n_data:/home/node/.n8n'
    depends_on:
      n8n_db:
        condition: service_healthy
    restart: unless-stopped
configs:
  gateway:
    file: ./docker/Caddyfile
volumes:
  postgres_data: null
  backend_storage: null
  n8n_postgres_data: null
  n8n_data: null
